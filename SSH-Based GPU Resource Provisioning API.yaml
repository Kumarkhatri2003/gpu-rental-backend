    get:
      operationId: admin_dashboard_retrieve
      description: Admin dashboard overview with comprehensive platform metrics
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/gpus/:
