components:
  schemas:
    AdminGPU:
      type: object
      description: GPU serializer for admin
      properties:
        id:
          type: string
          format: uuid
        host:
          type: string
          format: uuid
        host_email:
          type: string
          format: email
          readOnly: true
        gpu_name:
          type: string
          description: e.g., NVIDIA RTX 4090
          maxLength: 255
        vram_gb:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: VRAM in GB, e.g., 24
        price_per_hour:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Price in NPR per hour
        is_available:
          type: boolean
        total_rental_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_earnings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total_sessions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - gpu_name
      - host
      - host_email
      - price_per_hour
      - updated_at
      - vram_gb
    AdminHost:
      type: object
      description: Host serializer for admin
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        gpu_name:
          type: string
          nullable: true
          maxLength: 255
        vram_total:
          type: string
          nullable: true
          maxLength: 50
        status:
          $ref: '#/components/schemas/Status6d0Enum'
        uptime_percentage:
          type: number
          format: double
        reliability_score:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        total_sessions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        penalty_points:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
