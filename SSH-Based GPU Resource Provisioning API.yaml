      operationId: admin_gpus_list
      description: List all GPUs
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminGPUList'
          description: ''
  /api/admin/gpus/{id}/:
    get:
      operationId: admin_gpus_retrieve
      description: Get, update, delete GPU
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
